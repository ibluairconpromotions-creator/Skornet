            <h3>What is SKORNET?</h3>
            <p>SKORNET is a digital platform designed to connect the HVAC service ecosystem across India. It brings service businesses, certified field technicians, administrators, and customer service workflows into one connected digital environment—organizing technician verification, service-call dispatch, attendance tracking, and digital work history.</p>

            <p>SKORNET provides service business owners with complete operational visibility. Owners can monitor assigned, pending, and completed service calls from a single dashboard, track GPS-validated technician attendance, calculate travel distance in kilometers, and review overtime, travel allowances, expenses, and call-based incentives without relying on scattered WhatsApp chats or paper sheets.</p>

          </article>

            <h3>How are HVAC service calls assigned and tracked?</h3>
            <p>Service business owners or dispatchers assign service requests case-by-case based on the technician's validated skill set, location, and availability. Technicians receive call details and appointment reminders directly on the mobile app. Call status progresses transparently through assigned, pending, and completed states, allowing real-time monitoring across the entire service lifecycle.</p>
          </article>

            <h3>Does SKORNET support GPS-based attendance?</h3>
            <p>Yes. Technicians record their daily login and check-out through the mobile application, where device GPS coordinates validate their attendance point. The platform also associates location data with service calls and calculates travel distance in kilometers, providing owners with audit-ready attendance history and objective data for travel allowance reviews.</p>
